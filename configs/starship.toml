format = "${custom.shell}$directory${custom.git_info}$git_status$cmd_duration\n$character"
# right_format = "$cmd_duration"

scan_timeout = 500
command_timeout = 60000

[character]
format = "$symbol "

[directory]
truncation_length = 1
truncate_to_repo = true
format = "[$path]($style)"

[time]
disabled = false
time_format = "%T"
format = "[$time]($style)"

[cmd_duration]
min_time = 3000
show_milliseconds = true
format = '· (yellow)[$duration]($style)'

[git_branch]
disabled = true

[custom.shell]
description = "Active shell"
command = "printf '%s' \"$STARSHIP_SHELL\"" # must be fish-safe: starship runs it via $STARSHIP_SHELL
when = "true"
style = "bold fg:#89b4fa"
format = "[$output]($style) "

[custom.git_info]
command = "git_info"
when = "true"
style = "bold purple"
format = " [$output]($style) "
