#:tombi schema.strict = false

[env]
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 0 }
dynamic_padding = true
decorations = "none"
opacity = 1.0
blur = true
startup_mode = "Windowed"

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[font]
normal = { family = "VictorMono Nerd Font", style = "Regular" }
size = 11.5

[bell]
# animation = "Ease"
duration = 0

[cursor]
style = { shape = "Block", blinking = "Always" }
vi_mode_style = { shape = "Underline", blinking = "Off" }

[mouse]
hide_when_typing = true

################################################################################
### KEYBINDINGS
################################################################################

# ctrl+c is not bound: alacritty has no "performable" copy, so ctrl+c must stay SIGINT
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

# vi mode off: unbind its only default entry point (ctrl+shift+space)
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "None"

# no ReloadConfig action in alacritty: config live-reloads on file save
[[keyboard.bindings]]
key = "F"
mods = "Control|Alt|Shift"
action = "ToggleFullscreen"

################################################################################
### THEME : Catppuccin Mocha
################################################################################

